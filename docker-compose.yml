version: '3.8'

services:
  router-backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      # These keys should be passed securely in production or via a physical .env file
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434 # To connect back to local host's Ollama if running locally
    volumes:
      - sqlite_data:/app
    
  router-frontend:
    build: ./web_ui
    ports:
      - "3000:3000"
    depends_on:
      - router-backend

volumes:
  sqlite_data:
